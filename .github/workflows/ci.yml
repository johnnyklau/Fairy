name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  frontend:
    name: Frontend (typecheck, lint, format, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Format check
        run: npx prettier --check .

      - name: Test
        run: npx vitest run

  backend:
    name: Backend (fmt, clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # sherpa-onnx-sys's build.rs downloads its prebuilt static libs
          # into target/sherpa-onnx-prebuilt, outside Cargo's own tracked
          # build-output layout. Without this, rust-cache restores the
          # *build script's cached fingerprint* (which tells Cargo "already
          # ran, here's the -L path it printed last time") but never
          # restores the directory that path points to, since it isn't
          # part of target/{debug,release}/{build,deps,.fingerprint}. Cargo
          # then trusts the stale fingerprint, skips rerunning build.rs,
          # and the linker fails to find the library that was never
          # actually restored. Explicitly caching this directory keeps it
          # in sync with the fingerprint that references it.
          cache-directories: src-tauri/target/sherpa-onnx-prebuilt

      - name: Force sherpa-onnx-sys to re-verify its native libs
        # Belt-and-suspenders for the fingerprint/directory desync
        # described above: clearing just this crate's build fingerprint
        # makes Cargo always rerun its build.rs, which itself only
        # re-downloads if target/sherpa-onnx-prebuilt is actually missing
        # -- so this stays cheap (no network call) once that directory is
        # warm from cache, while guaranteeing the two can never drift out
        # of sync again even if rust-cache's own caching behavior changes.
        working-directory: src-tauri
        run: cargo clean -p sherpa-onnx-sys

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo test 2>&1 | Tee-Object -FilePath $env:RUNNER_TEMP\test_output.log
          exit $LASTEXITCODE

      - name: Publish test output on failure
        if: failure()
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Backend cargo test output"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          Get-Content $env:RUNNER_TEMP\test_output.log | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
